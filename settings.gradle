pluginManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'emuStudio'

include ':application'

include ':plugins:compiler:as-8080'
include ':plugins:compiler:as-ssem'
include ':plugins:compiler:as-z80'
include ':plugins:compiler:brainc-brainduck'
