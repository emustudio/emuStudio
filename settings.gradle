include ':plugins:device:abstract-tape'
include ':plugins:device:adm3A-terminal'
include ':plugins:device:vt100-terminal'
include ':plugins:device:simh-pseudo'
include ':plugins:device:ssem-display'
include ':plugins:device:zxspectrum-bus'
include ':plugins:device:zxspectrum-ula'
include ':plugins:device:audiotape-player'

include ':plugins:memory:ram-mem'
include ':plugins:memory:rasp-mem'
include ':plugins:memory:ssem-mem'
