import org.gradle.api.GradleException

apply from: "$rootDir/gradle/conventions/java-conventions.gradle"

if (!project.hasProperty('antlrPackage')) {
  throw new GradleException("'antlrPackage' must be defined before applying antlr compiler module conventions")
}

def antlrPackageName = project.property('antlrPackage').toString()
def antlrPackageDirectory = antlrPackageName.replace('.', '/')

generateGrammarSource {
  maxHeapSize = "128m"
  arguments += ['-package', antlrPackageName, '-visitor', '-no-listener']
  outputDirectory = file("${buildDir}/generated-src/antlr/main/${antlrPackageDirectory}")
}

compileJava.dependsOn generateGrammarSource

tasks.matching { it.name == 'compileGeneratedJava' }.configureEach {
  dependsOn generateGrammarSource
}

sourceSets {
  generated {
    java.srcDir "${buildDir}/generated-src/antlr/main"
  }
  main {
    java.srcDirs = [
            'src/main/java', "${buildDir}/generated-src/antlr/main"
    ]
  }
}

compileJava.source sourceSets.generated.java, sourceSets.main.java

idea {
  module {
    sourceDirs += file("build/generated-src/antlr")
  }
}

copy {
  from('src/main/examples')
  into "$buildDir/libs/examples"
}

copy {
  from('src/main/scripts')
  into "$buildDir/libs/scripts"
}
