name: emuStudio Build

permissions:
  contents: read
  pull-requests: write

on: [ push ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # Build the merged shared APIs instead of older published snapshots.
      - name: Check out emuLib
        uses: actions/checkout@v4
        with:
          repository: emustudio/emuLib
          ref: c4c53604a91cda2d9be4738a85e6db21e7112768
          path: .ci/emuLib
      - name: Check out CPU test suite
        uses: actions/checkout@v4
        with:
          repository: emustudio/cpu-testsuite
          ref: 0edb4e398f453108c822203844aaccc84ac4cc63
          path: .ci/cpu-testsuite
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: >-
          ./gradlew build
          -PemuLibPath=.ci/emuLib
          -PcpuTestSuitePath=.ci/cpu-testsuite
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_21_X64
