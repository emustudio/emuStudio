name: emuStudio Build

permissions:
  contents: read
  pull-requests: write

on: [ push ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check out CPU test suite
        uses: actions/checkout@v4
        with:
          repository: emustudio/cpu-testsuite
          ref: 31b4b818b7c3177dda7b7352d3339274fa6ddc4e
          path: .ci/cpu-testsuite
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: >-
          ./gradlew build
          -PcpuTestSuitePath=${{ github.workspace }}/.ci/cpu-testsuite
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_21_X64
