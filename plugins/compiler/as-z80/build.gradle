import org.apache.tools.ant.filters.ReplaceTokens

plugins {
  id 'java'
  id 'idea'
  id 'antlr'
  id 'com.adarshr.test-logger' version '3.1.0'
}

dependencies {
  antlr libs.antlr
  implementation libs.antlrRuntime

  implementation libs.emuLib
  implementation libs.slf4JApi

  testImplementation libs.cpuTestSuite
  testImplementation libs.junit
  testImplementation libs.easyMock
  testImplementation libs.slf4JSimple
}

generateGrammarSource {
  maxHeapSize = "128m"
  arguments += ['-package', 'net.emustudio.plugins.compiler.asZ80', '-visitor', '-no-listener']
  outputDirectory = file("${buildDir}/generated-src/antlr/main/net/emustudio/plugins/compiler/asZ80")
}
compileJava.dependsOn generateGrammarSource

sourceSets {
  generated {
    java.srcDir "${buildDir}/generated-src/antlr/main"
  }
  main {
    java.srcDirs = [
            'src/main/java', "${buildDir}/generated-src/antlr/main"
    ]
  }
}
compileJava.source sourceSets.generated.java, sourceSets.main.java

idea {
  module {
    sourceDirs += file("build/generated-src/antlr")
  }
}

jar {
  archiveVersion = ''
  manifest {
    attributes manifestAttributes('net.emustudio.plugins.compiler.asZ80.Runner')
  }
}

processResources {
  filesMatching("**/*.properties") {
    filter ReplaceTokens, tokens: [
            "project.version": project.version,
            "today.year"     : new Date().format("yyyy")
    ]
  }
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'
javadoc.options.encoding = 'UTF-8'

copy {
  from('src/main/examples')
  into "$buildDir/libs/examples"
}

copy {
  from('src/main/scripts')
  into "$buildDir/libs/scripts"
}
