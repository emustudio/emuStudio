plugins {
  id 'idea'
  id 'antlr'
}

ext {
  moduleMainClass = 'net.emustudio.plugins.compiler.rasp.Runner'
  antlrPackage = 'net.emustudio.plugins.compiler.rasp'
}

dependencies {
  antlr libs.antlr
  implementation libs.antlrRuntime

  implementation project.rootProject.project(":plugins:memory:rasp-mem")
}

apply from: "$rootDir/gradle/conventions/antlr-compiler-conventions.gradle"
