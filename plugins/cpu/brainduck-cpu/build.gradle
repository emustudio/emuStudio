plugins {
  id 'java'
  id 'net.emustudio.edigen-gradle-plugin' version '1.6.0-SNAPSHOT'
  id 'com.adarshr.test-logger' version '4.0.0'
  id 'jacoco'
}

repositories {
  mavenCentral()
}

dependencies {
  implementation libs.emuLib
  implementation libs.slf4JApi
  memoryLib project(":plugins:memory:byte-mem")

  testImplementation libs.cpuTestSuite
  testImplementation libs.junit
  testImplementation libs.easyMock
  testImplementation libs.slf4JSimple
}

edigen {
  decoderName = 'net.emustudio.plugins.cpu.brainduck.gui.DecoderImpl'
  disassemblerName = 'net.emustudio.plugins.cpu.brainduck.gui.DisassemblerImpl'
}

apply from: "$rootDir/gradle/conventions/java-conventions.gradle"

test {
  finalizedBy jacocoTestReport // report is always generated after tests run
}

jacocoTestReport {
  dependsOn test // tests are required to run before generating the report
}
